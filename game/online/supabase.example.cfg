; Copy this file to game/online/supabase.cfg (which git ignores) and fill it in from
; your Supabase project: Project Settings > API. See docs/ACCOUNTS.md.
;
; The anon key is a public key: it ships inside the game, and row-level security
; (supabase/migrations) is what keeps each player to their own data. NEVER put the
; service_role key here.

[supabase]

url="https://YOUR-PROJECT-REF.supabase.co"
anon_key="YOUR-ANON-KEY"
; The sign-in providers you turned on (Authentication > Providers), in the order the
; buttons show: google, discord, github, apple, twitch, azure, gitlab...
providers=["google", "discord"]
