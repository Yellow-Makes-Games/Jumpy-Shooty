# Exports the Windows build on every push to main and attaches it to that
# commit's GitHub Release (created by the Version tag workflow) as
# JumpyShooty-windows-<version tag>.zip, so it unzips to a folder carrying the
# version, e.g.
# https://github.com/Yellow-Makes-Games/Jumpy-Shooty/releases/download/v0.1.1/JumpyShooty-windows-v0.1.1.zip
# The link to share, which always shows the newest build:
# https://github.com/Yellow-Makes-Games/Jumpy-Shooty/releases/latest
name: Playtest build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Per commit: every release gets its own build, so a newer push must not
  # cancel an older one.
  group: playtest-build-${{ github.sha }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-windows-template

      - name: Download Godot and the Windows export template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-cache && cd ~/godot-cache
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d templates
          rm templates.tpz

      - name: Install Godot
        run: |
          set -euo pipefail
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          cp ~/godot-cache/templates/* "$tdir/"
          chmod +x ~/godot-cache/godot
          echo "$HOME/godot-cache" >> "$GITHUB_PATH"

      - name: Import assets
        run: godot --headless --import --path . || godot --headless --editor --quit --path .

      # The Version tag workflow tags this same push a few seconds in; the wait
      # covers a slow or queued run. Found before the export, so the game can show it.
      - name: Find this commit's version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=""
          for _ in $(seq 30); do
            version=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[] | "\(.object.sha) \(.ref | sub("^refs/tags/"; ""))"' |
              awk -v sha="$GITHUB_SHA" '$1 == sha && $2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print $2 }' | head -n1)
            [ -n "$version" ] && break
            sleep 10
          done
          if [ -z "$version" ]; then
            echo "::error::No version tag on $GITHUB_SHA, so there is no release to attach the build to"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP_NAME=JumpyShooty-windows-$version.zip" >> "$GITHUB_ENV"

      # The main menu shows the release version (Game.version_label): write it into
      # the project before exporting.
      - name: Stamp the version into the game
        run: |
          set -euo pipefail
          sed -i '/^config\/version=/d' project.godot
          sed -i "/^\[application\]/a config/version=\"$VERSION\"" project.godot
          grep -n '^config/version=' project.godot

      # Online accounts (docs/ACCOUNTS.md): game/online/supabase.cfg is kept out of git,
      # so it is written here from the repository's Actions variables SUPABASE_URL,
      # SUPABASE_KEY (the public anon / publishable key, never service_role) and
      # SUPABASE_PROVIDERS (e.g. "google, discord"). Without them the build simply has
      # no sign-in.
      - name: Write the Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          SUPABASE_PROVIDERS: ${{ vars.SUPABASE_PROVIDERS }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_KEY are not set: this build has no online accounts"
            exit 0
          fi
          # "google, discord" -> "google", "discord"
          providers=$(echo "${SUPABASE_PROVIDERS:-google}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | sed 's/.*/"&"/' | paste -sd, - | sed 's/,/, /g')
          {
            echo '[supabase]'
            echo
            echo "url=\"$SUPABASE_URL\""
            echo "anon_key=\"$SUPABASE_KEY\""
            echo "providers=[$providers]"
          } > game/online/supabase.cfg
          grep -v anon_key game/online/supabase.cfg

      - name: Export Windows build
        run: |
          set -euo pipefail
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/JumpyShooty.exe
          test -s builds/windows/JumpyShooty.exe

      - name: Zip
        run: |
          set -euo pipefail
          cd builds/windows && zip -9 -q "../$ZIP_NAME" JumpyShooty.exe
          ls -lh "../$ZIP_NAME"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" "builds/$ZIP_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$ZIP_NAME"
          echo "Attached [$ZIP_NAME]($url) to $VERSION" >> "$GITHUB_STEP_SUMMARY"
